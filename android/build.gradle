// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        playServicesLocationVersion = "21.3.0"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        maven {
            // All of Detox' artifacts are provided via the npm module
            url "$rootDir/../node_modules/detox/Detox-android"
        }
    }
}

project(":react-native-nitro-geolocation") {
    plugins.withId("com.android.library") {
        // Geolocation does not inherit the root NDK version. Keep its C++ runtime
        // compatible with React Native's bundled libc++_shared.so.
        android.ndkVersion = rootProject.ext.ndkVersion
    }
}

println  "rootDir: ${rootDir}"
apply plugin: "com.facebook.react.rootproject"
