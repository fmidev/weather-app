name: Live integration tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest live integration
    # These events cannot access DEFAULTCONFIG, which contains the live API configuration.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24.14.1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Restore live API configuration
        env:
          DEFAULT_CONFIG: ${{ secrets.DEFAULTCONFIG }}
        shell: bash
        run: |
          if [ -z "$DEFAULT_CONFIG" ]; then
            echo "::error::DEFAULTCONFIG secret is required for live integration tests"
            exit 1
          fi
          printf '%s\n' "$DEFAULT_CONFIG" > defaultConfig.ts

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run live integration tests
        run: yarn test:integration:live
